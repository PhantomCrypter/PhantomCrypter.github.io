# ----------------------------------------------------------------------------
# BADGES Y CERTIFICACIONES
#   title:  nombre (obligatorio)
#   issuer: quién lo emite (Cisco Networking Academy, INE, HTB...)
#   date:   texto libre, ej. "2026-03"   (opcional)
#   url:    link de verificación, ej. Credly (opcional; si lo pones la tarjeta es clicable)
#   icon:   emoji de la tarjeta (opcional; por defecto 🏅)
# ----------------------------------------------------------------------------
badges:
  - title: eJPT
    issuer: INE Security
    icon: "🎓"
  - title: Hawks Academy
    issuer: Hawks Academy
    icon: "🎓"
  # Ejemplo:
