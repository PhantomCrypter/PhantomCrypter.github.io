# ----------------------------------------------------------------------------
# BADGES Y CERTIFICACIONES
#   title:         nombre (obligatorio)
#   issuer:        quién lo emite
#   date:          texto libre, ej. "Mayo 2024"
#   credential_id: ID de la credencial (opcional)
#   icon:          emoji de la tarjeta (opcional; por defecto 🏅)
#   url:           link externo de verificación -> la tarjeta abre ese link
#   image:         imagen del certificado alojada en el blog -> la tarjeta la
#                  muestra en un visor dentro de la misma página
#                  Ej.: /assets/img/achievements/deloitte.webp
#   (si tiene url y image, manda url; sin ninguno de los dos no es clicable)
# ----------------------------------------------------------------------------
badges:
  - title: eJPT
    issuer: INE Security
    icon: "🎓"
    url: "https://certs.ine.com/f33683e4-f6f3-41a8-a3c1-c8cae9f2d868#acc.eSGBjFzR"

  - title: Hawks Academy
    issuer: Hawks Academy
    icon: "🎓"
    url: "https://credsverse.com/credentials/cae0d91b-08d5-4f6a-9dfb-094545a990ef?preview=1"

  - title: Certified Ethical Hacker (EC-Council)
    issuer: Universidad CENFOTEC
    icon: "🛡️"
    url: "https://www.credly.com/badges/c99a7e11-1e00-4fca-9a4c-4c8f2190f5f2"

  - title: Linux Unhatched
    issuer: Cisco
    icon: "🐧"
    url: "https://www.credly.com/badges/3e406d34-0b3c-4abd-99d5-309dea2063f1"

  - title: Introduction to Cybersecurity
